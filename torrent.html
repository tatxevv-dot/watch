<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TorrServer — watch.</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--bg2:#f5f5f7;--ink:#1d1d1f;--mute:#6e6e73;--line:#d2d2d7}
@media(prefers-color-scheme:dark){:root{--bg:#000;--bg2:#1d1d1f;--ink:#f5f5f7;--mute:#a1a1a6;--line:#424245}}
*{box-sizing:border-box;margin:0;padding:0}body{font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:24px}.wrap{max-width:860px;margin:0 auto}h1{font-size:28px;margin-bottom:16px}label{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);font-size:16px;outline:0}button{margin-top:16px;width:100%;height:48px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;cursor:pointer}#status{margin-top:14px;color:var(--mute);min-height:22px}video{display:none;width:100%;margin-top:20px;border-radius:16px;background:#000;aspect-ratio:16/9}.err{color:#ff6961}.ok{color:#30d158}</style>
</head>
<body>
<div class="wrap">
<h1>TorrServer</h1>
<label for="magnet">Magnet link</label>
<input id="magnet" placeholder="magnet:?xt=urn:btih:...">
<label for="token">ADMIN_TOKEN</label>
<input id="token" type="password" placeholder="ADMIN_TOKEN">
<button onclick="play()">Play</button>
<div id="status"></div>
<video id="player" controls autoplay playsinline></video>
</div>
<script>
const BACKEND_URL='https://watch-nxsha.onrender.com';
async function play(){
 const magnet=document.getElementById('magnet').value.trim();
 const token=document.getElementById('token').value.trim();
 const status=document.getElementById('status');
 const video=document.getElementById('player');
 status.className='';
 if(!magnet||!token){status.textContent='Введите magnet и ADMIN_TOKEN.';status.classList.add('err');return;}
 status.textContent='Готовим торрент…';
 try{
  const response=await fetch(BACKEND_URL+'/api/torrent/stream',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({magnet})});
  const data=await response.json();
  try{localStorage.setItem('ADMIN_TOKEN',token);}catch(e){}
  if(!response.ok)throw new Error(data.error||'Не удалось получить поток');
  status.textContent='Поток готов. Запуск…';status.classList.add('ok');
  video.src=data.streamUrl;video.style.display='block';await video.play();
 }catch(error){status.textContent=error.message;status.classList.add('err');}
}
(function(){
 const q=new URLSearchParams(location.search).get('magnet');
 const tokenEl=document.getElementById('token');
 try{const saved=localStorage.getItem('ADMIN_TOKEN');if(saved&&!tokenEl.value)tokenEl.value=saved;}catch(e){}
 if(!q)return;
 document.getElementById('magnet').value=q;
 if(tokenEl.value.trim())play();
 else{const st=document.getElementById('status');st.textContent='Введите ADMIN_TOKEN — воспроизведение начнётся автоматически.';tokenEl.focus();
  tokenEl.addEventListener('change',()=>{if(tokenEl.value.trim())play();},{once:true});}
})();
</script>
</body>
</html>
