name: TMDB Embed API audio language probe

on:
  push:
    branches:
      - feat/nxsha-source
    paths:
      - .github/workflows/tmdb-embed-audio-probe.yml

permissions:
  contents: read

jobs:
  tmdb-embed-audio-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Start official TMDB Embed API container
        run: |
          docker run --rm --memory=1024m --cpus=1 -p 127.0.0.1:8787:8787 \
            -e TMDB_API_KEY="${{ secrets.TMDB_API_KEY }}" \
            --name tmdb-embed-probe \
            inside4ndroid/tmdb-embed-api:latest &
          echo $! > /tmp/tmdb-embed-pid

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/ > /tmp/tmdb-embed-health.json; then
              echo "TMDB Embed API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "TMDB Embed API did not become healthy"
          docker logs tmdb-embed-probe --tail 100
          exit 2

      - name: Request movie sources and inspect audio languages
        shell: bash
        run: |
          set +e
          curl -fsS --max-time 180 'http://127.0.0.1:8787/api/v1/sources?tmdbId=68721&type=movie' > /tmp/tmdb-embed-sources.json
          result=$?
          python3 - <<'PY'
          import json
          from pathlib import Path
          try:
              data = json.loads(Path('/tmp/tmdb-embed-sources.json').read_text())
          except Exception:
              data = {}
          sources = data.get('sources') or data.get('results') or []
          audio = []
          russian = []
          for source in sources:
              provider = source.get('provider') or source.get('providerName') or source.get('name') or 'unknown'
              quality = source.get('quality') or ''
              for track in source.get('audioTracks') or source.get('audio') or []:
                  language = str(track.get('language') or track.get('lang') or '').lower()
                  label = str(track.get('label') or track.get('title') or '')
                  is_russian = language in ('ru', 'rus', 'ru-ru') or 'russian' in (language + ' ' + label).lower() or 'дубляж' in label.lower()
                  item = {'provider': provider, 'quality': quality, 'language': language, 'label': label[:80]}
                  audio.append(item)
                  if is_russian:
                      russian.append(item)
          report = {
            'candidate': 'Inside4ndroid/TMDB-Embed-API',
            'testedFrom': 'GitHub Actions, not Render',
            'tmdbId': 68721,
            'movie': 'Iron Man 3',
            'sourcesFound': len(sources),
            'audioTracksFound': len(audio),
            'russianAudioTracks': len(russian),
            'russianTracks': russian,
            'allAudioTracks': audio,
            'limitations': ['Metadata inspection only', 'Not full playback verification', 'Render access not verified', 'Content permissions not verified']
          }
          print(json.dumps(report, indent=2, ensure_ascii=False))
          Path('/tmp/tmdb-embed-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n')
          PY
          cat /tmp/tmdb-embed-report.json
          echo "Probe exit code: $result"
          exit "$result"

      - name: Stop TMDB Embed API container
        if: always()
        run: |
          docker stop tmdb-embed-probe 2>/dev/null || true
